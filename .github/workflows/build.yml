name: Build firmware

on:
  push:
    branches: [main]
    tags: ['*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: python -m pip install platformio==6.2.0
      - name: Build all boards
        run: pio run
      - name: Package firmware and DIYFlasher catalog
        run: python scripts/package_firmware.py
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: tovarishsatoshi-firmware
          path: dist/
          if-no-files-found: error
